<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle Powers · CodexWars</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><main class="app-shell shell"><header class="topbar enter"><a class="back-button" href="results.html" aria-label="Back to quiz results">←</a><a class="brand" href="index.html"><span class="brand-mark">C</span>CODEX<b>WARS</b></a><span class="status">LOADOUT</span></header><section class="powers-header enter delay-1"><p class="eyebrow">UNLOCKED LOADOUT</p><h1>Battle Powers</h1><p>Choose your power before entering the battle.</p></section><section class="power-grid enter delay-2" id="powerOptions"><button class="power-card power-option rarity-gold" data-power="Fireball"><span class="rarity-label">LEGENDARY</span><span class="icon">🔥</span><h3>Fireball</h3><p>Launch an explosive blast at your opponent.</p><div class="power-info"><span>80 DAMAGE</span><span>40 ENERGY</span><span>12S CD</span></div></button><button class="power-card power-option rarity-purple" data-power="Arrow Rain"><span class="rarity-label">EPIC</span><span class="icon">🏹</span><h3>Arrow Rain</h3><p>Rain precision arrows over a wide battle zone.</p><div class="power-info"><span>55 DAMAGE</span><span>55 ENERGY</span><span>18S CD</span></div></button><button class="power-card power-option rarity-blue" data-power="Shield"><span class="rarity-label">RARE</span><span class="icon">🛡</span><h3>Shield</h3><p>Raise a barrier that absorbs incoming damage.</p><div class="power-info"><span>60 BLOCK</span><span>30 ENERGY</span><span>14S CD</span></div></button><button class="power-card power-option rarity-purple" data-power="Lightning"><span class="rarity-label">EPIC</span><span class="icon">⚡</span><h3>Lightning</h3><p>Call down an instant, focused strike.</p><div class="power-info"><span>70 DAMAGE</span><span>60 ENERGY</span><span>20S CD</span></div></button><button class="power-card power-option rarity-blue" data-power="Ice Blast"><span class="rarity-label">RARE</span><span class="icon">❄</span><h3>Ice Blast</h3><p>Freeze your foe and slow their movement.</p><div class="power-info"><span>40 SLOW</span><span>45 ENERGY</span><span>16S CD</span></div></button><button class="power-card power-option rarity-grey" data-power="Heal"><span class="rarity-label">COMMON</span><span class="icon">💚</span><h3>Heal</h3><p>Restore health when the fight gets close.</p><div class="power-info"><span>120 HEAL</span><span>35 ENERGY</span><span>15S CD</span></div></button></section><button class="button continue enter delay-2" id="startBattle" disabled>Start Battle</button></main><script src="js/app.js"></script><script src="js/powers.js"></script></body></html>
